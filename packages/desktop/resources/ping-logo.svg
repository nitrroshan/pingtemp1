<svg viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ping-gradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="ping-glow" cx="50%" cy="50%" r="15%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect x="20" y="20" width="984" height="984" rx="225" fill="#0c1425" />

  <!-- Concentric ripple rings -->
  <circle cx="512" cy="512" r="430" stroke="url(#ping-gradient)" stroke-width="36" stroke-linecap="round" stroke-dasharray="614 205" opacity="0.9" />
  <circle cx="512" cy="512" r="338" stroke="url(#ping-gradient)" stroke-width="36" stroke-linecap="round" stroke-dasharray="512 184" opacity="0.8" />
  <circle cx="512" cy="512" r="246" stroke="url(#ping-gradient)" stroke-width="31" stroke-linecap="round" stroke-dasharray="389 164" opacity="0.7" />
  <circle cx="512" cy="512" r="154" stroke="url(#ping-gradient)" stroke-width="26" stroke-linecap="round" stroke-dasharray="246 143" opacity="0.6" />

  <!-- Center glow dot -->
  <circle cx="512" cy="512" r="61" fill="url(#ping-glow)" />
  <circle cx="512" cy="512" r="31" fill="white" opacity="0.95" />
</svg>
