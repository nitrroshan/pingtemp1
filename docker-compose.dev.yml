# docker-compose.dev.yml — MongoDB only for local development
# Usage: docker compose -f docker-compose.dev.yml up -d
# Then run backend + frontend separately:
#   bun run dev:backend
#   bun run dev:frontend

services:
  mongodb:
    image: mongo:7
    container_name: ping-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ping-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ping-mongo-data:
    name: ping-mongo-data
