# docker-compose.yml — Production stack (no MongoDB — use Atlas)
# Usage: docker compose up -d --build
#
# Prerequisites:
#   - MongoDB Atlas connection string in packages/backend/.env (MONGODB_URI)
#   - Azure OpenAI credentials in packages/backend/.env

services:
  collab:
    build:
      context: .
      dockerfile: packages/collab-service/Dockerfile
    container_name: ping-collab
    restart: unless-stopped
    ports:
      - "${COLLAB_PORT:-1234}:1234"
    volumes:
      - ping-collab:/app/data/collab
      - ping-workspaces:/app/data/workspaces
    environment:
      - NODE_ENV=production
      - COLLAB_PORT=1234
      - COLLAB_HEALTH_PORT=1235
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:1235/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    container_name: ping-backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-3002}:3002"
    env_file:
      - ./packages/backend/.env
    environment:
      - NODE_ENV=production
      - API_PORT=3002
      - COLLAB_MODE=external
      - COLLAB_URL=ws://collab:1234
    volumes:
      - ping-app-state:/app/data/plans
      - ping-workspaces:/app/data/workspaces
    depends_on:
      collab:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3002/api/v2/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3002}
    container_name: ping-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ping-app-state:
    name: ping-app-state
  ping-collab:
    name: ping-collab
  ping-workspaces:
    name: ping-workspaces
